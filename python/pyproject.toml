[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mstt"
version = "0.2.0"
description = "Simulation, analysis, and visualization tooling for the multi-sensor target tracker"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mstt-sim = "mstt.sim.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mstt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint and format configuration lives in the repository-root ruff.toml so that a
# single configuration governs python/ and scripts/ alike.
