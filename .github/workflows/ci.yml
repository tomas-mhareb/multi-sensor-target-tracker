name: CI

# Runs on every push to an integration branch and on every pull request.
# The pipeline grows with the project: Python lint and unit tests from V0.1,
# a C++ build and ctest from V0.3, sanitizers and static analysis from V0.8.
# See docs/design-decisions.md ADR-002 for why CI exists this early.

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch cancels the previous run, so CI reports on the
# current state of a branch rather than queueing behind superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Ubuntu, not macOS: CON-002 requires Linux support, and development happens
    # on macOS. Running CI on the target platform is what surfaces divergence
    # while it is still one commit's worth of work to fix.
    name: Python lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "./python[dev]"

      - name: Lint
        run: ruff check python

      - name: Check formatting
        run: ruff format --check python

      - name: Unit tests
        run: pytest python/tests -v

      - name: Smoke test the simulator end to end
        # Verifies the CLI actually produces output, not merely that imports resolve.
        run: |
          python -m mstt.sim.run --scenario config/scenarios/A_single_cv.yaml
          test -s data/runs/A_single_cv/truth.csv
          echo "rows: $(($(wc -l < data/runs/A_single_cv/truth.csv) - 1))"
