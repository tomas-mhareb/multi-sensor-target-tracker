name: CI

# Runs on every push to an integration branch and on every pull request.
# The pipeline grows with the project: Python lint and unit tests from V0.1, a C++
# build and ctest from V0.3, sanitizers and static analysis at V0.8.
# See docs/design-decisions.md ADR-002 for why CI exists this early.

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch cancels the previous run, so CI reports on the
# current state of a branch rather than queueing behind superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Ubuntu, not macOS: CON-002 requires Linux support, and development happens on
    # macOS. Running CI on the target platform is what surfaces divergence while it
    # is still one commit's worth of work to fix.
    name: Python lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "./python[dev]"

      - name: Lint
        run: ruff check python

      - name: Check formatting
        run: ruff format --check python

      - name: Unit tests
        run: pytest python/tests -v

      - name: Smoke test the simulator end to end
        # Verifies the CLI actually produces output, not merely that imports resolve.
        run: |
          python -m mstt.sim.run --scenario config/scenarios/B_single_noisy.yaml
          test -s data/runs/B_single_noisy/measurements.jsonl
          echo "measurements: $(wc -l < data/runs/B_single_noisy/measurements.jsonl)"

      - name: Golden vectors are current
        # Closes the cross-language verification loop. The C++ job proves the C++
        # implementation matches the committed golden vectors; this step proves those
        # vectors still match the Python implementation. Without it, a change to the
        # Python side would leave both other checks passing while the two
        # implementations silently disagreed -- exactly the mirrored-track failure the
        # golden vectors exist to prevent.
        run: |
          python scripts/generate_golden_vectors.py
          git diff --exit-code -- tests/data/golden/ || {
            echo "::error::Golden vectors are stale. The Python implementation changed."
            echo "Regenerate with: python scripts/generate_golden_vectors.py"
            echo "Then confirm the C++ tests still pass before committing."
            exit 1
          }

  cpp:
    name: C++ build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        # Eigen and GoogleTest are pinned by tag, so the cache only needs to change
        # when the declaration does. Keyed on that file's hash for exactly that reason.
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        # Warnings are errors in CI but not in a local developer build. A warning
        # should stop a change from merging without making it impossible to compile
        # while mid-way through writing something.
        run: cmake -B build -G Ninja -DMSTT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Tracker executable runs
        run: ./build/apps/tracker --version
