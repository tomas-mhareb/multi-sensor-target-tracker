# Scenario B — single target observed by a noisy radar.
#
# The first scenario with a sensor in it. A single target flies a constant-velocity
# pass across the surveillance area while a radar at the site datum observes it.
#
# The target deliberately does not start at the origin. Bearing is undefined at zero
# range, so a trajectory passing through the sensor would produce enormous early
# errors that have nothing to do with the tracker, and debugging the filter would
# become debugging the geometry. This path holds the target between roughly 358 m
# and 447 m from the radar throughout, closest at t = 30 s.
#
# The radar parameters are representative of a small civilian surveillance set:
# metre-level range accuracy, roughly one degree of bearing accuracy, and detection
# that is good but not certain. Note the consequence of that bearing figure: at 400 m
# a 1 degree error subtends about 7 m of cross-range error, more than three times the
# range error. That asymmetry is the whole reason a bearing-only camera is worth
# adding in V0.9 (ADR-003).

name: B_single_noisy
description: Single constant-velocity target observed by a noisy radar.

seed: 20260915

simulation:
  duration_s: 60.0
  timestep_s: 0.1

targets:
  - id: 1
    position_m: [-400.0, 200.0]
    velocity_mps: [8.0, 4.0]

sensors:
  - id: radar_0
    type: radar
    position_m: [0.0, 0.0]
    update_rate_hz: 10.0
    range_noise_m: 2.0
    bearing_noise_deg: 1.0
    detection_probability: 0.95
    false_alarm_rate_per_scan: 0.5
    max_range_m: 5000.0
