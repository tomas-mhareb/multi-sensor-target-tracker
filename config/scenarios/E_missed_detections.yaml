# Scenario E — frequent missed detections.
#
# Scenario B with detection probability cut to 0.60 and false alarms disabled, so
# the only difference from the baseline is the sensor's failure to report. A tracker
# must coast through the gaps on prediction alone; at 10 Hz a 0.60 detection
# probability means runs of three or more consecutive misses are common, which is
# what exercises the track-deletion logic in V0.6.
#
# Isolating one effect per scenario is deliberate: if a scenario varied detection
# probability and false alarm rate together, a change in tracking performance could
# not be attributed to either.

name: E_missed_detections
description: Single target with a radar that frequently fails to detect it.

seed: 20260915

simulation:
  duration_s: 60.0
  timestep_s: 0.1

targets:
  - id: 1
    position_m: [-400.0, 200.0]
    velocity_mps: [8.0, 4.0]

sensors:
  - id: radar_0
    type: radar
    position_m: [0.0, 0.0]
    update_rate_hz: 10.0
    range_noise_m: 2.0
    bearing_noise_deg: 1.0
    detection_probability: 0.60
    false_alarm_rate_per_scan: 0.0
    max_range_m: 5000.0
